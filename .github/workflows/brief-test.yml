# TEMPORARY: test runs of the longer brief, before it's merged. Builds two editions with the real data and
# the real Claude API (the repo's ANTHROPIC_API_KEY secret, never printed), but saves nothing to the data
# branch and publishes nothing. The results go to a separate brief-preview branch for review. Removed after use.
#   1. today:   today's edition, exactly as the 8am run would build it
#   2. bigday:  everything from the last 44 hours, to show a full NFL Sunday slate in one edition
name: Brief test (temporary)
on:
  push:
    branches: [claude/morning-huddle-spec-plan-2fgh1z]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/data-branch.sh checkout data-branch
      - name: Copy the data branch (nothing is saved back)
        run: |
          for d in today bigday; do mkdir -p runs/$d && cp -r data-branch/. runs/$d/ && rm -rf runs/$d/.git; done
      - name: Today's edition
        run: node pipeline/build-edition.js --out runs/today
      - name: Today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pipeline/write-brief.js --out runs/today 2>&1 | tee runs/today/brief-log.txt || true
      - name: Big-day edition (last 44 hours)
        env:
          WINDOW_HOURS: '44'
        run: node pipeline/build-edition.js --out runs/bigday
      - name: Big-day brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pipeline/write-brief.js --out runs/bigday 2>&1 | tee runs/bigday/brief-log.txt || true
      - name: Save the results to the brief-preview branch
        run: |
          cd runs
          find . -name 'editions' -type d -prune -exec rm -rf {} +
          git init -q -b brief-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Brief test results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" brief-preview
