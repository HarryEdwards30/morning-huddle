# Morning Huddle: builds the edition and publishes the app to GitHub Pages, all in one workflow
# (commits made by a workflow don't start other workflows, so the publish has to happen here too).
#
# When it runs:
#   - Every morning: scheduled at 21:00 and 22:00 UTC. Whichever lands at 8am or later in Melbourne
#     (AEDT or AEST) builds the day's edition; the other skips (see scripts/should-run.js).
#   - "Run workflow" on the Actions tab: always builds a fresh edition.
#   - A change merged into main: publishes the app with the latest edition already on the data branch.
#
# The app shows the sample edition only if the data branch has no real edition yet.

name: Morning Huddle

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to save editions to the data branch
  pages: write
  id-token: write

# Only one run at a time; a newer run waits rather than cancelling one that's halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Claude library
        run: npm ci --no-audit --no-fund

      - name: Get the data branch
        run: bash scripts/data-branch.sh checkout data-branch

      - name: Check whether to build an edition
        id: gate
        run: |
          node scripts/should-run.js "${{ github.event_name }}" data-branch > gate.txt
          cat gate.txt
          grep '^run=' gate.txt >> "$GITHUB_OUTPUT"

      - name: Build today's edition
        id: edition
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node pipeline/build-edition.js --out data-branch

      # One Claude call writes the brief. The key comes from the repo's ANTHROPIC_API_KEY secret and is never printed.
      # If this fails, the edition keeps today's data without the written parts, and status.json says why.
      - name: Write the brief with Claude
        id: brief
        if: steps.gate.outputs.run == 'true' && steps.edition.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pipeline/write-brief.js --out data-branch

      - name: Save the edition to the data branch
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/data-branch.sh save data-branch

      # A scheduled run that skipped has nothing new to publish.
      - name: Build the site
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: node scripts/build-site.js data-branch

      - name: Prepare GitHub Pages
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v6

      - name: Upload the site
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v5

      # The last good edition is still published above; this just makes a failed edition show as a red run.
      - name: Report a failed edition
        if: steps.edition.outcome == 'failure' || steps.brief.outcome == 'failure'
        run: |
          if [ "${{ steps.edition.outcome }}" = "failure" ]; then
            echo "Today's edition couldn't be built. The app is still showing the last good edition."
            echo "See the 'Build today's edition' step above for the reason."
          else
            echo "Today's data was published, but the written brief couldn't be produced."
            echo "See the 'Write the brief with Claude' step above for the reason."
          fi
          exit 1
