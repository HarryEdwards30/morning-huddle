<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Morning Huddle</title>
  <meta name="description" content="Jack's daily NFL and NBA brief.">
  <meta name="theme-color" content="#16181c">
  <meta name="color-scheme" content="dark">

  <!-- Home-screen app settings -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Huddle">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Fonts: Barlow Condensed for headings and scores, Source Sans 3 for reading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">MH</span>
      <span class="brand-name">Morning Huddle</span>
    </div>
    <button class="icon-button" id="info-button" type="button" aria-label="About this edition" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div id="notices"></div>

  <main id="view" tabindex="-1">
    <p class="loading">Loading today's brief…</p>
  </main>

  <nav class="tab-bar" aria-label="Sections">
    <a href="#nfl" data-tab="nfl">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5c-1.5-5 1-11.5 6-14s9-1 9 0 1.5 5-1 10-9.5 5.5-14 4z M8.5 15.5l7-7 M10.5 11.5l2 2 M12.5 9.5l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>NFL</span>
    </a>
    <a href="#nba" data-tab="nba">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>NBA</span>
    </a>
    <a href="#teams" data-tab="teams">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>My Teams</span>
    </a>
    <a href="#watch" data-tab="watch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Watch</span>
    </a>
  </nav>

  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title">
    <h2 id="info-title">About this edition</h2>
    <div id="info-body"></div>
    <form method="dialog"><button class="button">Close</button></form>
  </dialog>
</body>
</html>
